name: CI & Cross-Platform Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check extension JS syntax
        run: node -c extension/*.js

      - name: Run extension JS unit tests
        run: node --test extension/tests/extension.test.js

      - name: Run go vet
        run: go vet ./...

      - name: Run Go tests
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ] && ! command -v gcc >/dev/null 2>&1; then
            go test -v ./...
          else
            CGO_ENABLED=1 go test -race -v ./...
          fi

      - name: Build static binary (CGO_ENABLED=0)
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -v ./cmd/efekta
